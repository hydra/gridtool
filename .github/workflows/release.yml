name: Release

# Run from the Actions tab: choose "Release", then "Run workflow", and enter a tag that has
# been pushed. Builds the tag's source for each platform and attaches the packages to a draft
# GitHub release for that tag, ready to review and publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example 20261101-1530
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: macos-latest
            formats: dmg
          - os: ubuntu-latest
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Package
        run: cargo packager --release --formats ${{ matrix.formats }}
        env:
          # The AppImage tools are AppImages themselves, and runners have no FUSE to mount them.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # The strip in the AppImage tools is old, and can fail on libraries from newer distributions.
          NO_STRIP: 1

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/packages/*.exe
            target/packages/*.dmg
            target/packages/*.deb
            target/packages/*.AppImage

  release:
    name: Attach to the release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: packages/*
