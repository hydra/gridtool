[package]
name = "gridtool"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_ltreeview = "0.9.0"
egui_material_icons = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = "0.17.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

[patch.crates-io]
# Upstream egui_ltreeview 0.9.0 requires egui 0.36; this copy is patched for egui 0.37.
egui_ltreeview = { path = "vendor/egui_ltreeview" }
